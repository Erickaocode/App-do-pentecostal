<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: no iPhone, o app ocupa a tela inteira (inclusive atrás do entalhe).
         Sem zoom: o app fica "cravado" na tela, como um app instalado. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover" />
    <title>App do Pentecostal</title>
    <meta name="description" content="Leia a Bíblia, grife versículos, favorite e anote suas reflexões, mesmo sem internet." />
    <meta name="theme-color" content="#FAF6F0" />

    <!-- Instalação como app ("Adicionar à Tela de Início"). Caminhos relativos: o app
         roda tanto na raiz (computador) quanto em subcaminho (GitHub Pages). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pentecostal" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #FAF6F0;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      /* Tela travada: sem rolagem elástica, sem zoom com toque duplo, sem a página
         "andar" quando o teclado abre. */
      html,
      body {
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        position: fixed;
        inset: 0;
        margin: 0;
      }
      /* O app ocupa só a parte visível da tela: quando o teclado abre, ele encolhe
         até a borda de cima do teclado (variáveis atualizadas pelo script abaixo). */
      #root {
        position: fixed;
        left: 0;
        right: 0;
        top: var(--vv-top, 0px);
        height: var(--vv-height, 100%);
      }
    </style>
    <script>
      (function () {
        var vv = window.visualViewport;
        if (!vv) return;
        var style = document.documentElement.style;
        function update() {
          var keyboardOpen = window.innerHeight - vv.height > 80;
          if (keyboardOpen) {
            style.setProperty('--vv-height', vv.height + 'px');
            style.setProperty('--vv-top', vv.offsetTop + 'px');
          } else {
            // Teclado fechado: tela cheia de novo. O iPhone às vezes "esquece" a altura
            // antiga e deixaria uma faixa vazia embaixo.
            style.removeProperty('--vv-height');
            style.removeProperty('--vv-top');
            if (window.scrollY !== 0) window.scrollTo(0, 0);
          }
        }
        // O teclado sobe animando e o iPhone avisa a altura final com atraso: segue a tela
        // quadro a quadro por um instante para não abrir vão entre o app e o teclado.
        var followUntil = 0;
        function follow() {
          update();
          if (Date.now() < followUntil) requestAnimationFrame(follow);
        }
        function settle() {
          var running = Date.now() < followUntil;
          followUntil = Date.now() + 700;
          if (!running) requestAnimationFrame(follow);
        }
        vv.addEventListener('resize', settle);
        vv.addEventListener('scroll', settle);
        window.addEventListener('resize', settle);
        document.addEventListener('focusin', settle);
        document.addEventListener('focusout', function () {
          settle();
          setTimeout(settle, 300);
        });
        update();
        // Pinça (zoom) no iPhone: o Safari ignora o user-scalable em alguns casos.
        document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
      })();
    </script>
  <link rel="icon" href="/App-do-pentecostal/web/app/favicon.ico"/><script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
      }
    </script>
  </head>
